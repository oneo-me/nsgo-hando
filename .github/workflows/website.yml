name: Website

# Pushing the site, or the workflow, builds it and publishes the static
# output to GitHub Pages. The repository's Pages source must be GitHub
# Actions.
on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install the website's dependencies
        working-directory: website
        run: bun install --frozen-lockfile
      - name: Build the site
        working-directory: website
        run: bun run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
