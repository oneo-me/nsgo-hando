name: Hando
id: me.oneo.hando
version: 0.2026.1

dev:
  target: native

# The packages the README offers, which a Mac with Xcode builds.
build:
  output: dist
  targets:
    - macos_arm64
    - macos_x64
    - windows_arm64
    - windows_x64
    - linux_arm64
    - linux_x64
    - ios
    - android_arm64

# iOS and macOS ask before an app may reach other devices on the local
# network.
apple:
  info:
    NSLocalNetworkUsageDescription: Hando finds nearby devices and transfers files over your local network.

# Multicast discovery needs these beyond the runtime's internet
# permission.
android:
  permissions:
    - ACCESS_NETWORK_STATE
    - ACCESS_WIFI_STATE
    - CHANGE_WIFI_MULTICAST_STATE

release:
  github: oneo-me/nsgo-hando

# Downloads update themselves from the latest GitHub release's appcasts,
# whose installers the secret half of this key signs, given to CI as the
# NSGO_UPDATES_KEY secret.
updates:
  key: jf+sY15rJDLA4ktuKCKSJPRoIjmh0Dv055tqmDcG0NM=
